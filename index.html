<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Site oficial do HazonPlay. Acesse a política de privacidade e o contato de suporte.">
  <meta name="theme-color" content="#0b0712">
  <title>HazonPlay — Seu conteúdo. Seu momento.</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0712; --panel:#130b20; --line:#372444; --text:#eee7f7; --muted:#cbb9dc; --accent:#d9acff; --cyan:#54e4ee; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:radial-gradient(ellipse at 80% 0%,#482065 0,transparent 48%),var(--bg); color:var(--text); font:17px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header, main, footer { width:min(100% - 40px,960px); margin-inline:auto; }
    header { padding:32px 0; }
    header img { display:block; width:190px; height:auto; }
    main { flex:1; display:flex; align-items:center; padding-block:48px 96px; }
    .content { max-width:680px; }
    .eyebrow { color:var(--accent); font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:12px 0 18px; font-size:clamp(38px,7vw,64px); line-height:1.08; letter-spacing:-.04em; }
    p { color:var(--muted); margin:0 0 30px; }
    nav { display:flex; flex-wrap:wrap; gap:14px; }
    a { color:var(--accent); text-underline-offset:4px; }
    .button { display:inline-block; padding:12px 18px; border:1px solid #9c4de8; border-radius:10px; background:#8b2bd4; color:#fff; font-weight:650; text-decoration:none; }
    .button.secondary { border-color:var(--line); background:var(--panel); color:var(--text); }
    a:focus-visible { outline:3px solid var(--cyan); outline-offset:4px; }
    footer { border-top:1px solid var(--line); padding:22px 0 30px; color:var(--muted); font-size:14px; }
    @media (max-width:600px) { header,main,footer { width:min(100% - 32px,960px); } main { padding-block:32px 64px; } }
  </style>
</head>
<body>
  <header><a href="./" aria-label="HazonPlay — início"><img src="hazonplay.svg" alt="HazonPlay"></a></header>
  <main>
    <section class="content" aria-labelledby="title">
      <div class="eyebrow">HazonPlay</div>
      <h1 id="title">Seu conteúdo.<br>Seu momento.</h1>
      <p>Bem-vindo ao site oficial do HazonPlay. Encontre aqui a política de privacidade e o contato de suporte.</p>
      <nav aria-label="Links principais">
        <a class="button" href="privacidade.html">Política de privacidade</a>
        <a class="button secondary" href="mailto:playhazon@gmail.com">Falar com o suporte</a>
      </nav>
    </section>
  </main>
  <footer>HazonPlay · <a href="mailto:playhazon@gmail.com">playhazon@gmail.com</a></footer>
</body>
</html>
